build:
  maxIssues: 0

style:
  ForbiddenImport:
    active: true
    imports:
      # Invariant 4 (CLAUDE.md): nothing sensitive is ever written to logcat. All logging goes
      # through com.asktrix.core.common.log.AsktrixLog, which redacts and is stripped in release.
      - value: 'android.util.Log'
        reason: 'Use AsktrixLog (core:common). Raw Log.* risks writing customer PII to logcat.'
      - value: 'java.util.Date'
        reason: 'Use java.time (minSdk 29 has it natively).'
    forbiddenPatterns: ''
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 4
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    ignoreAnnotatedFunctions: ['Composable']
  LongMethod:
    active: true
    threshold: 70
    ignoreAnnotated: ['Composable', 'Preview']

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  LateinitUsage:
    active: false

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
