  - generic [ref=f7e316]:
    - generic [ref=f7e317]: Section 05
    - heading "How customer data is protected" [level=2] [ref=f7e318]
    - paragraph [ref=f7e319]: The central requirement of your document is that employees must be able to do their work without ever holding a customer's contact details. That is the design principle the whole system is built around, not a feature added on top.
    - table [ref=f7e320]:
      - rowgroup [ref=f7e321]:
        - row [ref=f7e322]:
          - columnheader "Risk" [ref=f7e323]
          - columnheader "How it is prevented" [ref=f7e324]
      - rowgroup [ref=f7e325]:
        - row [ref=f7e326]:
          - cell "An employee copies customer numbers and takes them to a competitor" [ref=f7e327]
          - cell "The full number is never sent to the phone. There is no screen that can display it and nothing stored on the device to extract. The employee presses call and the system connects them" [ref=f7e328]
        - row [ref=f7e329]:
          - cell "An employee photographs the screen" [ref=f7e330]
          - cell "Screenshots and screen recording are blocked by the operating system throughout the app. A capture returns a blank image" [ref=f7e331]
        - row [ref=f7e332]:
          - cell "A phone is lost or stolen" [ref=f7e333]
          - cell "Cached client data is encrypted with a key held in the phone's security hardware. The cache expires automatically and is destroyed on sign out" [ref=f7e334]
        - row [ref=f7e335]:
          - cell "A modified or rooted phone is used to bypass the rules" [ref=f7e336]
          - cell "The app verifies device integrity using hardware-backed attestation and refuses to operate on a compromised handset" [ref=f7e337]
        - row [ref=f7e338]:
          - cell "Permissions are bypassed by editing the app" [ref=f7e339]
          - cell "Every role restriction is enforced again on the server. The app is never trusted to police itself" [ref=f7e340]
        - row [ref=f7e341]:
          - cell "A manager quietly looks up a customer's real number" [ref=f7e342]
          - cell "Possible only through a dedicated screen that requires a written reason and records the manager's name, the customer, and the time in a permanent audit log" [ref=f7e343]
        - row [ref=f7e344]:
          - cell "Sensitive data leaks into device logs" [ref=f7e345]
          - cell "Direct logging is blocked at build time by an automated rule, and log statements are stripped entirely from release builds" [ref=f7e346]
        - row [ref=f7e347]:
          - cell "A future code change accidentally exposes a number" [ref=f7e348]
          - cell "An automatic check inspects every response before it leaves the server and blocks any that contains an unmasked number or email" [ref=f7e349]
    - generic [ref=f7e350]:
      - heading "Digital Personal Data Protection Act 2023" [level=4] [ref=f7e351]
      - paragraph [ref=f7e352]: A compliance document is included in the handover covering lawful basis, data minimisation, retention periods, employee notice requirements and consent for call recording. Masking, automatic expiry and the audit trail were designed against these obligations rather than retrofitted to them.
  - generic [ref=f7e353]:
    - generic [ref=f7e354]: Section 06
    - heading "Calling, and why it works the way it does" [level=2] [ref=f7e355]
    - paragraph [ref=f7e356]: Section 6 of your requirement document asks for calls to be recorded on the device. That is not possible on any modern Android phone. Google removed the ability for applications to record telephone calls in 2022 and enforces it at the operating system level. No vendor can deliver it as written, and any who claims otherwise is either mistaken or describing something that will stop working.
    - paragraph [ref=f7e357]:
      - strong [ref=f7e358]: The business requirement is still met, by a different route.
      - text: "Calls are placed over the internet between the employee's app and the customer, rather than over the telephone network. This produces three advantages:"
    - list [ref=f7e359]:
      - listitem [ref=f7e360]:
        - strong [ref=f7e361]: Recording is lawful and technically possible
        - text: ", because the audio path belongs to your system rather than to a telecom operator."
      - listitem [ref=f7e362]:
        - strong [ref=f7e363]: The employee never learns the customer's number
        - text: ", which is the actual point of section 5."
      - listitem [ref=f7e364]:
        - strong [ref=f7e365]: There are no call charges at all.
        - text: A telephony provider capable of the original approach costs approximately Rs 1,599 per user per month. For thirty staff that is Rs 5,75,000 per year, avoided permanently.
    - paragraph [ref=f7e366]: The customer receives a link and joins from their own phone browser. They install nothing. The call length, outcome and recording are written against the client record automatically.
    - generic [ref=f7e367]:
      - heading "If you later want calls to reach ordinary phone numbers" [level=4] [ref=f7e368]
      - paragraph [ref=f7e369]: That requires a licensed telecom partner and is a commercial decision rather than a technical one. The system is built so that this can be added without redesigning anything. Quoted separately if and when you want it.
