        - generic [ref=f2e127]:
          - heading "The part worth showing off" [level=4] [ref=f2e128]
          - paragraph [ref=f2e129]: Hiding a button is not security, because an app can be modified. The rules are enforced on the server as well. If you sign in as Accounts and try to move a government filing anyway, the server refuses it. The app is not trusted to police itself.
        - paragraph [ref=f2e130]:
          - text: On the phone, open
          - strong [ref=f2e131]: Settings
          - text: to see the signed-in person, their job title and the exact list of what their role allows. That is why a missing button is never a mystery.
      - generic [ref=f2e132]:
        - heading "The admin console, screen by screen" [level=2] [ref=f2e133]
        - paragraph [ref=f2e134]:
          - text: Sign in at
          - link /admin/ [ref=f2e135] [cursor=pointer]:
            - /url: /admin/
          - text: as
          - code [ref=f2e136]: EMP003
          - text: . Seven screens, listed down the left.
        - generic [ref=f2e137]:
          - article [ref=f2e138]:
            - heading "Overview" [level=3] [ref=f2e139]
            - paragraph [ref=f2e140]: "The day at a glance: who checked in, how many calls went out, how long people spent talking, follow-ups falling due, and how many recordings are held."
          - article [ref=f2e141]:
            - heading "Employees" [level=3] [ref=f2e142]
            - paragraph [ref=f2e143]: One row per person. Whether they are on duty right now, when they checked in, calls made today, talk time, and their last known position with battery level.
          - article [ref=f2e144]:
            - heading "Location" [level=3] [ref=f2e145]
            - paragraph [ref=f2e146]: A map of where an employee has been during working hours. Pick a person from the list to draw their trail. Positions are only collected while they are on duty.
          - article [ref=f2e147]:
            - heading "Calls" [level=3] [ref=f2e148]
            - paragraph [ref=f2e149]: "Every call: who called, which client, whether it connected, how long it lasted, and whether a recording was kept."
          - article [ref=f2e150]:
            - heading "Clients" [level=3] [ref=f2e151]
            - paragraph [ref=f2e152]: The full pipeline with each client's stage, payment state and documents outstanding. Phone numbers and emails appear masked here too, exactly as they do on the phone.
          - article [ref=f2e153]:
            - heading "Devices" [level=3] [ref=f2e154]
            - paragraph [ref=f2e155]: Every enrolled handset, its Android version, app version, and whether it passed its security checks.
          - article [ref=f2e156]:
            - heading "Audit log" [level=3] [ref=f2e157]
            - paragraph [ref=f2e158]: Every single time an administrator revealed a customer's real phone number or email, who did it, and the reason they gave.
        - heading "The All / Demo / Real switch" [level=3] [ref=f2e159]
        - paragraph [ref=f2e160]:
          - text: "At the top of every screen there are three buttons:"
          - strong [ref=f2e161]: All
          - text: ","
          - strong [ref=f2e162]: Demo
          - text: and
          - strong [ref=f2e163]: Real
          - text: . This is how you separate the sample data from genuine activity.
        - list [ref=f2e164]:
          - listitem [ref=f2e165]:
            - strong [ref=f2e166]: Demo
            - text: shows only the made-up clients, calls and employees that ship with the system, so you always have something to present.
          - listitem [ref=f2e167]:
            - strong [ref=f2e168]: Real
            - text: "shows only what actually happened: your own logins, your own calls, your own phone. It starts completely empty and fills as you use it."
          - listitem [ref=f2e169]:
            - strong [ref=f2e170]: All
            - text: shows both together.
        - paragraph [ref=f2e171]:
          - text: Switch to
          - strong [ref=f2e172]: Real
          - text: ", and every figure drops to zero. Make one call from the phone, press Refresh, and watch it appear. That is a convincing thing to show someone, because it proves the numbers are not painted on."
      - generic [ref=f2e173]:
        - heading "The phone app, screen by screen" [level=2] [ref=f2e174]
        - heading "Installing it" [level=3] [ref=f2e175]
        - list [ref=f2e176]:
          - listitem [ref=f2e177]:
            - heading "Download on the phone" [level=3] [ref=f2e178]
            - paragraph [ref=f2e179]:
              - text: Open
              - link "the releases page" [ref=f2e180] [cursor=pointer]:
                - /url: https://github.com/AdwaitPro/asktrix-crm-agent/releases/latest
              - text: in the phone's browser and tap the
              - code [ref=f2e181]: .apk
              - text: file. Downloading it on a laptop and transferring it works too, it is just slower.
          - listitem [ref=f2e182]:
            - heading "Allow the install" [level=3] [ref=f2e183]
            - paragraph [ref=f2e184]:
              - text: Android will warn that this did not come from the Play Store. Tap
              - emphasis [ref=f2e185]: Settings
              - text: in that prompt, turn on
              - emphasis [ref=f2e186]: Allow from this source
              - text: ", then go back and tap Install. This is normal for an app given directly to staff."
          - listitem [ref=f2e187]:
            - heading "Say yes to the permissions" [level=3] [ref=f2e188]
            - paragraph [ref=f2e189]: The app asks for location, camera and microphone the first time each one is needed, and explains why at the moment it asks. Location is for attendance, the camera is for the check-in photo, the microphone is for calls. Nothing is requested up front for no reason.
        - generic [ref=f2e190]:
          - heading "You do not need to wipe your phone" [level=4] [ref=f2e191]
          - paragraph [ref=f2e192]: The strictest version of this system expects a company-owned phone that has been factory reset and enrolled. That is not required to run or demonstrate it. Install it on a normal personal phone and everything in this guide works.
        - heading "What you see once you are in" [level=3] [ref=f2e193]
        - generic [ref=f2e194]:
          - article [ref=f2e195]:
            - heading "Dashboard" [level=3] [ref=f2e196]
            - paragraph [ref=f2e197]: Clients assigned to you, work waiting, and follow-ups due today. This is the starting point each morning.
          - article [ref=f2e198]:
            - heading "Client detail" [level=3] [ref=f2e199]
            - paragraph [ref=f2e200]: "Everything about one client: their masked contact details, the history of what has happened, and the status buttons your role is allowed to press."
          - article [ref=f2e201]:
            - heading "Calls" [level=3] [ref=f2e202]
            - paragraph [ref=f2e203]: The calls you have made, whether each one connected, and how long it lasted.
          - article [ref=f2e204]:
            - heading "Attendance" [level=3] [ref=f2e205]
            - paragraph [ref=f2e206]: Check in at the start of the day and out at the end, with your position and an optional photo.
          - article [ref=f2e207]:
            - heading "Settings" [level=3] [ref=f2e208]
            - paragraph [ref=f2e209]: Who you are signed in as, your job title, and the full list of what your role permits. Also the device's security status.
      - generic [ref=f2e210]:
        - heading "How a call works" [level=2] [ref=f2e211]
        - paragraph [ref=f2e212]: This is the part most worth understanding, because it is not a normal phone call and it is deliberately not one.
        - list [ref=f2e213]:
          - listitem [ref=f2e214]:
            - heading "The employee presses Call" [level=3] [ref=f2e215]
            - paragraph [ref=f2e216]: They never see or type a phone number. They press Call on a client. The system knows who that is.
          - listitem [ref=f2e217]:
            - heading "A private call room opens" [level=3] [ref=f2e218]
            - paragraph [ref=f2e219]: "The server creates a one-off room and hands back two links: one for the employee, one for the customer. The call screen opens on the phone automatically."
          - listitem [ref=f2e220]:
            - heading "The customer joins by link" [level=3] [ref=f2e221]
            - paragraph [ref=f2e222]: They tap the link and they are in. There is nothing to install on their side. The call travels over the internet, not the telephone network.
          - listitem [ref=f2e223]:
            - heading "The call is recorded and logged" [level=3] [ref=f2e224]
            - paragraph [ref=f2e225]: When either side hangs up, the length, the outcome and the recording are written against that client. It shows up in the console within seconds.
        - generic [ref=f2e226]:
          - heading "Why not just dial the number" [level=4] [ref=f2e227]
          - paragraph [ref=f2e228]: Three reasons. The employee never learns the customer's real number, so they cannot take it with them when they leave. There are no per-minute charges, because nothing touches the phone network. And Android blocks apps from recording ordinary phone calls, so a real call could not be recorded at all. Going over the internet solves all three at once.
        - heading "Trying it yourself" [level=3] [ref=f2e229]
        - paragraph [ref=f2e230]:
          - text: You need two devices, or a phone and a laptop. Sign in on the phone as
          - code [ref=f2e231]: EMP001
          - text: ", open any client, press Call. Send yourself the customer link and open it on the other device. Allow the microphone on both. Speak."
        - paragraph [ref=f2e232]: Both sides must allow the microphone, or you will see "connected" with no sound. If that happens, close the call and start again, this time watching for the microphone prompt.
      - generic [ref=f2e233]:
        - heading "Check in and check out" [level=2] [ref=f2e234]
        - paragraph [ref=f2e235]:
          - text: Open
          - strong [ref=f2e236]: Attendance
          - text: and press Check in. The app records where you are and offers to take a photo. Press Check out at the end of the day. Both appear in the console immediately, and the check-in count on Overview goes up.
        - list [ref=f2e237]:
          - listitem [ref=f2e238]:
            - strong [ref=f2e239]: The camera prompt
            - text: appears before the photo screen opens. Allow it, and the front camera opens.
          - listitem [ref=f2e240]:
            - strong [ref=f2e241]: The photo is optional.
            - text: Check-in works without it if a manager does not require one.
          - listitem [ref=f2e242]:
            - strong [ref=f2e243]: Indoors,
            - text: a fresh satellite fix can take a while. The app falls back to the last position it knew rather than refusing to check you in.
          - listitem [ref=f2e244]:
            - strong [ref=f2e245]: Position is only collected while on duty.
            - text: Check out and it stops. It is not a tracker that runs all night.
      - generic [ref=f2e246]:
        - heading "Why phone numbers appear as 98XXXXXX12" [level=2] [ref=f2e247]
        - paragraph [ref=f2e248]:
          - text: Customer contact details are hidden everywhere. A number reads
          - code [ref=f2e249]: 98XXXXXX12
          - text: and an email reads
          - code [ref=f2e250]: siv****@gmail.com
          - text: . This is not a display trick. The full number is never sent to the phone at all, so there is nothing on the device to uncover, screenshot or copy out.
        - paragraph [ref=f2e251]: "The employee does not need the number. They press Call and the system connects them. That is the point: they can do the job without ever holding the customer's details."
        - paragraph [ref=f2e252]:
          - text: An administrator can reveal a real number when there is a genuine reason, from the Clients screen in the console. They have to type a reason, and it is written into the
          - strong [ref=f2e253]: Audit log
          - text: with their name and the time. Nobody looks quietly.
      - generic [ref=f2e254]:
        - heading "What happens when there is no signal" [level=2] [ref=f2e255]
        - paragraph [ref=f2e256]: Field staff lose signal constantly, in basements, lifts and villages. The app is built for that rather than surprised by it.
        - list [ref=f2e257]:
          - listitem [ref=f2e258]:
            - strong [ref=f2e259]: Nothing is lost.
            - text: A status change, a note or a check-in made with no signal is saved on the device and sent the moment the connection returns.
          - listitem [ref=f2e260]:
            - strong [ref=f2e261]: Nothing is duplicated.
            - text: Each action carries a unique ticket, so if it gets sent twice after a flaky retry, the server only counts it once.
          - listitem [ref=f2e262]:
            - strong [ref=f2e263]: Client data does not linger.
            - text: The copy held on the phone is encrypted and expires on its own, and it is wiped completely on sign-out.
        - paragraph [ref=f2e264]: "Worth demonstrating: turn on aeroplane mode, change a client's status, watch it save. Turn aeroplane mode off, wait a moment, and refresh the console. It is there."
      - generic [ref=f2e265]:
        - heading "Run the demo" [level=2] [ref=f2e266]
        - paragraph [ref=f2e267]: An order that shows the whole system in about ten minutes, built so each step sets up the next. Have the console open on a laptop and the app open on a phone.
        - list [ref=f2e268]:
          - listitem [ref=f2e269]:
            - heading "Open on the console" [level=3] [ref=f2e270]
            - paragraph [ref=f2e271]:
              - text: Sign in as
              - code [ref=f2e272]: EMP003
              - text: ". Stay on Overview. Say what the numbers are: people on duty, calls today, time on the phone, follow-ups due."
          - listitem [ref=f2e273]:
            - heading "Prove the data is real" [level=3] [ref=f2e274]
            - paragraph [ref=f2e275]:
              - text: Press
              - strong [ref=f2e276]: Real
              - text: . Everything drops to zero. Explain that what they were looking at was sample data, and that from here on everything they see is something you actually did in front of them. Leave it on Real.
          - listitem [ref=f2e277]:
            - heading "Check in on the phone" [level=3] [ref=f2e278]
            - paragraph [ref=f2e279]:
              - text: Sign in as
              - code [ref=f2e280]: EMP001
              - text: ", go to Attendance, check in, take the photo. Refresh the console. On duty goes from zero to one, with the photo and position attached."
          - listitem [ref=f2e281]:
            - heading "Show a client" [level=3] [ref=f2e282]
            - paragraph [ref=f2e283]: Open any client on the phone. Point at the masked phone number and explain that the real one is not on the device at all.
          - listitem [ref=f2e284]:
            - heading "Make a call" [level=3] [ref=f2e285]
            - paragraph [ref=f2e286]: Press Call, open the customer link on the laptop, allow the microphone on both, talk for a few seconds, hang up. Refresh the console. The call is in the Calls screen with its length.
          - listitem [ref=f2e287]:
            - heading "Show the roles" [level=3] [ref=f2e288]
            - paragraph [ref=f2e289]:
              - text: Sign out on the phone and back in as
              - code [ref=f2e290]: EMP006
              - text: ", the accounts clerk. Open a client. The call button is gone and the only status offered is"
              - emphasis [ref=f2e291]: payment received
              - text: . Then sign in as
              - code [ref=f2e292]: EMP005
              - text: ", documentation: no call button either, but the government filing status is there instead. Same app, same screen, different job."
          - listitem [ref=f2e293]:
            - heading "Show it works offline" [level=3] [ref=f2e294]
            - paragraph [ref=f2e295]: Aeroplane mode on. Change a status. It saves. Aeroplane mode off. Refresh the console and it has arrived.
          - listitem [ref=f2e296]:
            - heading "Finish on the audit log" [level=3] [ref=f2e297]
            - paragraph [ref=f2e298]: In the console, reveal a customer's real number with a reason. Open the Audit log and show the entry that just appeared, with your name on it.
      - generic [ref=f2e299]:
        - heading "If something looks wrong" [level=2] [ref=f2e300]
        - generic [ref=f2e301]:
          - term [ref=f2e302]: The console says the sign-in is wrong
          - definition [ref=f2e303]:
            - text: Use the employee code, not an email address.
            - code [ref=f2e304]: EMP003
            - text: ", password"
            - code [ref=f2e305]: asktrix123
            - text: . Only a Team Leader can open the console, so the other five codes will be refused here even though they work on the phone.
          - term [ref=f2e306]: A call says "a call is already in progress"
          - definition [ref=f2e307]: A previous call was closed in a way that left it hanging. Open the call screen and hang up properly, or wait two minutes and it clears itself. It will not stay stuck.
          - term [ref=f2e308]: The call connects but there is no sound
          - definition [ref=f2e309]: One side did not allow the microphone. Close the call, start again, and watch for the prompt on both devices. If a browser blocked it silently, check the padlock icon in the address bar and allow the microphone there.
          - term [ref=f2e310]: Check-in will not pick up my location
          - definition [ref=f2e311]: Step near a window or outside. Indoors a first satellite fix can take a minute. The app will fall back to your last known position rather than block you.
          - term [ref=f2e312]: The app never asked for the camera
          - definition [ref=f2e313]: It asks the first time you open the check-in photo screen. If you refused earlier, Android will not ask again. Go to Android Settings, Apps, Asktrix Agent, Permissions, and turn the camera on by hand.
          - term [ref=f2e314]: The console is empty
          - definition [ref=f2e315]:
            - text: Check whether the switch at the top is set to
            - strong [ref=f2e316]: Real
            - text: . Real is empty until you do something yourself. Press
            - strong [ref=f2e317]: Demo
            - text: or
            - strong [ref=f2e318]: All
            - text: to see the sample data again.
          - term [ref=f2e319]: The map does not appear
          - definition [ref=f2e320]: Pick an employee from the list on the Location screen first. The map draws that person's trail, so it stays blank until you choose someone.
          - term [ref=f2e321]: Android refuses to install the app
          - definition [ref=f2e322]: Allow installs from your browser, in Android Settings under Apps, Special access, Install unknown apps. Also make sure you are on Android 10 or newer.
      - generic [ref=f2e323]:
        - heading "Questions people ask" [level=2] [ref=f2e324]
        - generic [ref=f2e325]:
          - term [ref=f2e326]: Does it cost anything to run
          - definition [ref=f2e327]: No. Calls go over the internet rather than the phone network, so there are no per-minute charges, and the server and database run on free plans.
          - term [ref=f2e328]: Can an employee find out a customer's real number
          - definition [ref=f2e329]: No. The full number is never sent to the phone. There is no screen it can be revealed on and nothing stored on the device to dig out.
          - term [ref=f2e330]: Is this connected to the real CRM yet
          - definition [ref=f2e331]: Not yet. It runs against its own server, which follows the exact contract the real CRM will need to provide. When those endpoints exist, the app points at them and the rest is unchanged.
          - term [ref=f2e332]: Where are the call recordings kept
          - definition [ref=f2e333]: On the server, not on the phone. The employee's device is told that a recording exists but is never given a link to the audio.
          - term [ref=f2e334]: Does it track people after hours
          - definition [ref=f2e335]: No. Position is only sampled between check-in and check-out. Check out and it stops.
          - term [ref=f2e336]: Can I add my own real clients
          - definition [ref=f2e337]:
            - text: Yes. Anything you create is marked real rather than demo, so the
            - strong [ref=f2e338]: Real
            - text: view shows your data on its own, cleanly separated from the samples.
