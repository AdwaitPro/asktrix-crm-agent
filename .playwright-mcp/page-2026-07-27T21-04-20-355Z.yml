    - main [ref=f2e21]:
      - generic [ref=f2e22]:
        - paragraph [ref=f2e23]: Plain English guide
        - heading "Everything this system does, and how to drive it" [level=1] [ref=f2e24]
        - paragraph [ref=f2e25]:
          - text: Asktrix has two halves. Employees carry an
          - strong [ref=f2e26]: Android app
          - text: to work through the clients assigned to them. Managers watch it all from an
          - strong [ref=f2e27]: admin console
          - text: in a web browser. This page explains both, start to finish, assuming you have never seen either.
        - generic [ref=f2e28]:
          - link "Get running in 5 minutes" [ref=f2e29] [cursor=pointer]:
            - /url: "#quick"
          - link "Download the app" [ref=f2e30] [cursor=pointer]:
            - /url: https://github.com/AdwaitPro/asktrix-crm-agent/releases/latest
      - generic [ref=f2e31]:
        - generic [ref=f2e32]:
          - heading "The phone app" [level=3] [ref=f2e33]
          - paragraph [ref=f2e34]: For the person doing the work. Shows the clients assigned to them, lets them call a client, record what happened, mark progress, and check in for the day.
          - paragraph [ref=f2e35]: Android 10 or newer
        - generic [ref=f2e36]:
          - heading "The admin console" [level=3] [ref=f2e37]
          - paragraph [ref=f2e38]: For the person in charge. Shows who is on duty, where they are, every call made, every client's progress, and every time someone looked at a customer's real contact details.
          - paragraph [ref=f2e39]: Any web browser
      - generic [ref=f2e40]:
        - heading "Get running in 5 minutes" [level=2] [ref=f2e41]
        - paragraph [ref=f2e42]: You do not have to install anything to see most of the system. The console runs in a browser. Install the app only when you want to see the employee side on a real phone.
        - list [ref=f2e43]:
          - listitem [ref=f2e44]:
            - heading "Open the console" [level=3] [ref=f2e45]
            - paragraph [ref=f2e46]:
              - text: Go to
              - link "asktrix-crm.vercel.app/admin/" [ref=f2e47] [cursor=pointer]:
                - /url: /admin/
              - text: . Sign in with employee code
              - code [ref=f2e48]: EMP003
              - text: and password
              - code [ref=f2e49]: asktrix123
              - text: .
            - paragraph [ref=f2e50]: Only a Team Leader can open the console. EMP003 is Rohit Desai, the team leader in the sample data. The other five accounts are for the phone app.
          - listitem [ref=f2e51]:
            - heading "Look around" [level=3] [ref=f2e52]
            - paragraph [ref=f2e53]: You land on Overview. The buttons down the left switch between Employees, Location, Calls, Clients, Devices and the Audit log. There is sample data in every one of them, so nothing is empty.
          - listitem [ref=f2e54]:
            - heading "Install the app, if you want the full demo" [level=3] [ref=f2e55]
            - paragraph [ref=f2e56]:
              - text: Download the APK from
              - link "the releases page" [ref=f2e57] [cursor=pointer]:
                - /url: https://github.com/AdwaitPro/asktrix-crm-agent/releases/latest
              - text: on the Android phone itself. Android will ask you to allow installing from this source. Allow it, then open the file. See
              - link "the detailed install steps" [ref=f2e58] [cursor=pointer]:
                - /url: "#install"
              - text: if it gets stuck.
          - listitem [ref=f2e59]:
            - heading "Sign in on the phone" [level=3] [ref=f2e60]
            - paragraph [ref=f2e61]:
              - text: Use any code from
              - code [ref=f2e62]: EMP001
              - text: to
              - code [ref=f2e63]: EMP006
              - text: ", password"
              - code [ref=f2e64]: asktrix123
              - text: . What you can do changes depending on which one you pick, which is the whole point of the next section.
