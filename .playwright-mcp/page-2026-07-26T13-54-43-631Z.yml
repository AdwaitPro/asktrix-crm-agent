          - article [ref=f44e87]:
            - generic [ref=f44e88]:
              - heading "What are Masked Phone Numbers?" [level=1] [ref=f44e90]
              - generic [ref=f44e92]:
                - button [ref=f44e93] [cursor=pointer]:
                  - img "Positive Feedback" [ref=f44e96]
                - button [ref=f44e98] [cursor=pointer]:
                  - img "Negative Feedback" [ref=f44e101]
            - separator [ref=f44e103]
            - paragraph [ref=f44e104]:
              - emphasis [ref=f44e105]: Masked Phone Numbers
              - text: are a common pattern to anonymize communication between multiple parties and hide participant phone numbers. Instead of dialing directly from phone to phone, users communicate via a third ('proxy') phone number that forwards a call to the eventual destination.
            - separator [ref=f44e106]
            - generic [ref=f44e107]:
              - generic [ref=f44e108]:
                - generic [ref=f44e110]:
                  - heading "Why businesses mask phone numbers" [level=2] [ref=f44e111]
                  - link [ref=f44e112] [cursor=pointer]:
                    - /url: "#why-businesses-mask-phone-numbers"
                    - img "why-businesses-mask-phone-numbers page anchor" [ref=f44e114]
                - generic [ref=f44e118]:
                  - button [ref=f44e119] [cursor=pointer]:
                    - img "Positive Feedback" [ref=f44e122]
                  - button [ref=f44e124] [cursor=pointer]:
                    - img "Negative Feedback" [ref=f44e127]
              - paragraph [ref=f44e129]: Businesses mask phone numbers to protect participant privacy during short, transactional interactions. Many business use cases require a flurry of communications over a limited time frame. Having a service provider and a customer trade phone numbers for a transaction that will be over quickly is wholly unnecessary. While communications via text message and phone are necessary for logistical purposes, there often isn't a social need for two parties to trade phone numbers.
              - paragraph [ref=f44e130]:
                - text: This is where the need for so-called masked phone numbers arises. Also known as
                - emphasis [ref=f44e131]: proxied
                - text: ","
                - emphasis [ref=f44e132]: anonymized
                - text: ", or"
                - emphasis [ref=f44e133]: cloaked
                - text: phone communications, your business can enable this time-boxed communication without revealing unnecessary customer - or worker - information.
              - paragraph [ref=f44e134]: "Many business cases have use for this pattern; a non-exhaustive list of where masked phone numbers might make sense is:"
              - list [ref=f44e135]:
                - listitem [ref=f44e136]: Real Estate Agencies
                - listitem [ref=f44e137]: Ride-sharing Services
                - listitem [ref=f44e138]: Delivery Companies
                - listitem [ref=f44e139]: Food Delivery Services
                - listitem [ref=f44e140]: Peer-to-Peer Vacation Rentals
                - listitem [ref=f44e141]: Dating Applications
              - paragraph [ref=f44e142]: While setting up the infrastructure for anonymous communications is often a good choice for your users and workers, it also has a strong business case. With masked phone numbers, you add friction for users attempting to move off your platform for transactions, keeping more business with your company.
              - paragraph [ref=f44e143]:
                - text: See more of our
                - link "guidance on anonymous communications." [ref=f44e144] [cursor=pointer]:
                  - /url: /docs/proxy
            - generic [ref=f44e145]:
              - generic [ref=f44e146]:
                - generic [ref=f44e148]:
                  - heading "Business needs and safety" [level=3] [ref=f44e149]
                  - link [ref=f44e150] [cursor=pointer]:
                    - /url: "#business-needs-and-safety"
                    - img "business-needs-and-safety page anchor" [ref=f44e152]
                - generic [ref=f44e156]:
                  - button [ref=f44e157] [cursor=pointer]:
                    - img "Positive Feedback" [ref=f44e160]
                  - button [ref=f44e162] [cursor=pointer]:
                    - img "Negative Feedback" [ref=f44e165]
              - paragraph [ref=f44e167]:
                - text: In many cases, revealing a private phone number is a major cause of friction. In
                - emphasis [ref=f44e168]: extreme
                - text: cases, keeping phone numbers and other personally identifiable information private can even be a safety issue.
              - paragraph [ref=f44e169]: For limited duration conversations needed for logistics, there is no need for one party to continue to contact the other when the transaction or service is complete. By proxying communications from the start, your business can avoid any potential problems down the road - or even just annoyance from accidental dials.
              - separator [ref=f44e170]
