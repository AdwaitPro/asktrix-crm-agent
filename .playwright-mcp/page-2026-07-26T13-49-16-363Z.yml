            - cell [ref=f6e241]:
              - generic [ref=f6e243]:
                - paragraph [ref=f6e244]: Twilio recommends that customers review their proposed use-cases with qualified legal counsel to make sure that they comply with all applicable laws, in accordance with Twilio's Terms of Service (ToS). The best-practice guidance below is of a general nature, and is not to be taken as legal advice.
                - paragraph [ref=f6e245]
                - paragraph [ref=f6e246]: Customers must gain consent from the call recipient to receive commercial communications related to the customer’s specific purpose, product or service. If consent is not obtained, the Telecommunications Regulatory Authority of India (TRAI) will consider such calls Unsolicited Commercial Communications (UCC), which is subject to blocking or account termination action for local law compliance purposes.
                - paragraph [ref=f6e247]
                - paragraph [ref=f6e248]: The Department of Telecommunications (DoT) and TRAI manage a consumer portal for the recipients of UCC (and/or communications of a generally suspicious/fraudulent nature) to report voice calls that they did not consent to receive. This means the local authorities actively monitor for, and enforce, account blockings of non-compliant use-cases.
                - paragraph [ref=f6e249]
            - cell [ref=f6e250]
